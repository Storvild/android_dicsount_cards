name: Build and Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (e.g. 1.2.0, leave empty to read from gradle.properties)'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version and Build Release APK
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # 1. Triggered by Git Tag push (e.g., v1.1.2 -> 1.1.2)
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.versionName }}" ]]; then
            # 2. Triggered manually with explicit input in GitHub UI
            VERSION="${{ github.event.inputs.versionName }}"
          else
            # 3. Triggered manually without input -> parse version from gradle.properties
            VERSION=$(grep 'versionName=' gradle.properties | cut -d'=' -f2 | tr -d '\r\n ')
          fi

          echo "Building APK for version: ${VERSION}"
          ./gradlew assembleRelease -PversionName=${VERSION}

      - name: Sign APK with apksigner
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Safely decode keystore from Base64
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks

          # 2. Locate built APK and construct signed APK name with version
          UNSIGNED_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APK_BASENAME=$(basename "$UNSIGNED_APK" .apk)
          SIGNED_APK="app/build/outputs/apk/release/${APK_BASENAME}-signed.apk"

          # 3. Get Android Build-Tools path
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          # 4. Fallback KEY_PASS to KEYSTORE_PASSWORD if empty
          export KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

          # 5. ZipAlign and Sign using official Android SDK tools
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" "$SIGNED_APK"
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASS \
            "$SIGNED_APK"

          # 6. Clean up sensitive keystore file
          rm -f release.jks

          # Export variable for next steps
          echo "SIGNED_APK_PATH=$SIGNED_APK" >> $GITHUB_ENV

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: discount_cards-signed-apk
          path: ${{ env.SIGNED_APK_PATH }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.SIGNED_APK_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
